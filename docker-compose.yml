name: ecom-ops

services:
  postgres:
    image: postgres:17.11-bookworm
    container_name: ecom-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ecom_ops
      POSTGRES_USER: ecom
      POSTGRES_PASSWORD: ecom_pass
      TZ: Asia/Shanghai
      PGTZ: Asia/Shanghai
    ports:
      - "5433:5432"
    volumes:
      - ecom_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecom -d ecom_ops"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  minio:
    image: quay.io/minio/minio:RELEASE.2024-12-18T13-15-44Z
    container_name: ecom-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ecomadmin
      MINIO_ROOT_PASSWORD: ecomadmin123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ecom_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  minio-init:
    image: quay.io/minio/minio:RELEASE.2024-12-18T13-15-44Z
    container_name: ecom-minio-init
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ecomadmin
      MINIO_ROOT_PASSWORD: ecomadmin123
      S3_BUCKET: ecom-assets
    entrypoint:
      - /bin/sh
      - -c
      - |
        until mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; do
          echo "waiting for minio..."
          sleep 2
        done
        mc mb -p "local/$$S3_BUCKET" || true
        mc anonymous set download "local/$$S3_BUCKET" || true
        echo "bucket $$S3_BUCKET ready"
    restart: "no"

volumes:
  ecom_pg_data:
    name: ecom-pg-data
  ecom_minio_data:
    name: ecom-minio-data