# Application services only. Existing PostgreSQL and MinIO stay independently managed.
services:
  api:
    image: commerce-assistant-backend:${BACKEND_IMAGE_TAG:-local}
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.12-slim-bookworm}
    env_file:
      - ./.env.production
    command: ["python", "-m", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers", "--forwarded-allow-ips", "*"]
    expose:
      - "8000"
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    volumes:
      - runtime_files:/app/.local
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  worker:
    image: commerce-assistant-backend:${BACKEND_IMAGE_TAG:-local}
    env_file:
      - ./.env.production
    command: ["python", "-m", "app.workers.main"]
    restart: unless-stopped
    init: true
    stop_grace_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  scheduler:
    image: commerce-assistant-backend:${BACKEND_IMAGE_TAG:-local}
    env_file:
      - ./.env.production
    command: ["python", "-m", "app.workers.scheduler"]
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    image: ${NGINX_IMAGE:-nginx:stable-alpine}
    depends_on:
      - api
    ports:
      - "${HTTP_BIND_ADDRESS:-127.0.0.1}:${HTTP_PORT:-8080}:80"
    volumes:
      - ../../Front/dist:/usr/share/nginx/html:ro,z
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro,z
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  runtime_files:
